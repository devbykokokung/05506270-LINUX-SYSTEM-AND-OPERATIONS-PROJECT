# LogWatch configuration
# Format: KEY=value or KEY="value" (no spaces around =). The file is parsed, not
# executed. Unknown keys are errors, so a typo like MAX_ATTEMP is caught.

AUTH_LOG="/var/log/auth.log"                  # live ssh log; rotated copies (auth.log.1, auth.log.2.gz ...) are found automatically
LOG_FILE="/var/log/logwatch.log"              # this program's own log (also sent to the journal: journalctl -t logwatch)
AUTO_REPORT_DIR="/var/lib/logwatch/auto"      # daily reports from logwatch-auto.sh --report
MANUAL_REPORT_DIR="/var/lib/logwatch/manual"  # reports from logwatch.sh --report

TOP_N=10          # rows in each "top" list; also the cap for the IPs-over-limit list ("+N more")
MAX_ATTEMPT=5     # an IP is flagged when its failed attempts are MORE than this

# temporary : --block IP = iptables rule, gone on ufw reload/restart/reboot; add -y for a permanent ufw rule
# permanent : --block IP = permanent ufw rule
BLOCK_MODE="temporary"

WHITELIST="127.0.0.1 ::1"   # IPs that are never blocked (exact match, space or comma separated). Add your admin IPs.

# Chains used by the temporary block. Defaults are ufw's own, so a ufw reload clears the rule.
BLOCK_CHAIN="ufw-before-input"
BLOCK_CHAIN6="ufw6-before-input"

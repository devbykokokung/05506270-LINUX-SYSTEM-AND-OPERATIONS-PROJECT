# LogWatch configuration
# รูปแบบ: KEY="value"  (ห้ามมีช่องว่างรอบ =)

AUTH_LOG="/var/log/auth.log"              # ssh log ที่ crontab ไปอ่าน
AUTO_LOG_DIR="/var/lib/logwatch/auto"     # log.log, logs/, reports/ (จาก crontab)
MANUAL_LOG_DIR="/var/lib/logwatch/manual" # report ที่ผู้ใช้สั่งเอง
LOG_FILE="/var/log/logwatch.log"          # log การทำงานของโปรแกรม

TOP_N=10          # top N
MAX_ATTEMPT=5     # N attempt
DRY_RUN="ON"      # ON = --block เป็น dry-run ต้องใส่ -y / OFF = block ทันที

WHITELIST="127.0.0.1"   # IP ที่ห้าม block
